<svg xmlns="http://www.w3.org/2000/svg" width="960" height="214" viewBox="0 0 960 214" role="img" aria-label="Colophon: how this profile is built"><title>Colophon: how this profile is built</title><style>@font-face{font-family:'JBM';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBM';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:'JBM', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0;}</style><rect x="0.5" y="0.5" width="959" height="213" rx="14" fill="#0d1117" stroke="#1f2a37"/><circle cx="22" cy="20" r="4.5" fill="#2b3a4c"/><circle cx="38" cy="20" r="4.5" fill="#2b3a4c"/><circle cx="54" cy="20" r="4.5" fill="#2b3a4c"/><text x="74" y="24" font-size="11.5" fill="#8b98a8">kael@silicon: ~/colophon</text><line x1="1" y1="38.5" x2="959" y2="38.5" stroke="#1f2a37"/><text x="26" y="72" font-size="15" font-weight="700" fill="#e6edf3">Every graphic on this page is generated in this repo.</text><text x="26" y="96" font-size="12.5" fill="#8b98a8">Python writes pure SMIL/CSS SVG with JetBrains Mono embedded. No external image servers, no third-party</text><text x="26" y="116" font-size="12.5" fill="#8b98a8">stat cards, no rate limits. A daily Actions run pulls GraphQL and commits the result.</text><rect x="37.0" y="132" width="150" height="34" rx="8" fill="#0f1722" stroke="#34d399"/><text x="112.0" y="154" font-size="12.5" fill="#e6edf3" text-anchor="middle">graphql</text><rect x="221.0" y="132" width="150" height="34" rx="8" fill="#0f1722" stroke="#2b3a4c"/><text x="296.0" y="154" font-size="12.5" fill="#e6edf3" text-anchor="middle">python</text><line x1="191.0" y1="149" x2="215.0" y2="149" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="14" to="0" dur="0.9s" repeatCount="indefinite"/></line><path d="M213.0,145